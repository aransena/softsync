[metadata]
name = softsync
version = 0.3.0
description = A small local file-based soft synchronisation barrier for prepared services.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = Aran Sena
author_email = aransena@gmail.com
url = https://github.com/aransena/softsync
keywords = synchronization, barrier, recording, sensors, coordination
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Operating System :: POSIX
    Topic :: System :: Distributed Computing
project_urls =
    Repository = https://github.com/aransena/softsync

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10

[options.packages.find]
where = src
include = softsync*

[options.package_data]
softsync.uc =
    *.json
softsync.uc.schemas =
    *.json

[options.extras_require]
dev =
    pytest>=8
    ruff>=0.5

[options.entry_points]
console_scripts =
    softsync = softsync.cli:main
